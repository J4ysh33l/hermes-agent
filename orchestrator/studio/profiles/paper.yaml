# History, geography, news (Vox / Johnny Harris-like): paper tones, soft motion.
description: Paper. Warm off-white, ink colours and one burnt-orange accent, soft feel.

theme:
  bg: "#efe6d2"
  glow: "#f7f0de"
  panel: "#fffaf0"
  text: "#1d1a16"
  muted: "#6b6153"
  accent: "#c2410c"         # burnt orange: reads on cream (highlighter yellow did not)
  cool: "#1d4ed8"           # ink blue
  bad: "#b91c1c"
  good: "#15803d"
  font: montserrat
  background: glow

motion:
  feel: soft
  enter: rise
  exit: fade
  exit_frames: 8
  punch: 0.05
  drift: 0.05
  step: 0                   # smooth: the 12 fps look read as dropped frames next to the 30 fps captions
  transition: fade
  transition_frames: 10

captions:
  upper: false
  font: montserrat
  stroke: 10
  fill: "#1d1a16"           # ink on a paper-coloured outline (a black outline on dark text was unreadable)
  outline: "#fffaf0"

writing:
  format: how-it-works
  hooks: [question, curiosity, number]
  humour: occasional understatement
  tone: curious, calm, specific dates and places

elements:
  music: auto
  music_query: calm piano
  sfx: auto
  memes: off
