# My day: copy to $HERMES_HOME/myday/myday.yaml (install.sh does it once) and edit.
# Every key is optional; these are the defaults.

timezone: Asia/Kolkata
morning: "07:30"        # the morning card (also the cron time in install.sh's next steps)
wrap: "21:30"           # evening wrap-up: what is left before the day closes at midnight
goals_review: sun       # the weekly goals review comes with this day's wrap-up
top_count: 3            # how many tasks you pick as today's top
bill_remind_days: [3, 0]   # Telegram + To Do reminders this many days before the due date
bill_reminder_hour: 10     # hour of the To Do phone reminder on those days
calendar: true          # today's Outlook meetings on the morning card

points:
  task: 10
  top: 20               # a top-3 task (instead of task)
  all_clear: 50         # every task due today done
  bill_on_time: 15
  bill_late: 5
  snooze: -5
  goal_step: 25
  goal_done: 100

lists:                  # Microsoft To Do list names (created if missing; tasks "" = your default list)
  tasks: ""
  bills: Bills
  work_goals: "Goals · Work"
  personal_goals: "Goals · Personal"


level_names: [Starter, Mover, Doer, Finisher, Closer, Machine, Legend]
