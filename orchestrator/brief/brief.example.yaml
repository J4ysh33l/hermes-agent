# Morning brief settings. Copy to $HERMES_HOME/brief/brief.yaml and edit there.
# Things you change from Telegram (/brief watch, /brief mute, /brief follow) are kept in
# $HERMES_HOME/brief/prefs.json instead, so this file keeps your comments.
# No secrets in this file: tokens and keys live in $HERMES_HOME/.env (see orchestrator/brief/README.md).

timezone: Asia/Kolkata
lookback_hours: 26          # first run (or after a gap): how far back to read
top_items: 8                # news headlines (the only items with links)
work_items: 15              # Slack, Gmail and Outlook items summarised; /brief more shows everything

# Which sources run. A source with no credentials is reported as "not set up", never silently skipped.
sources:
  slack: true
  gmail: true
  outlook: true
  news: true
  markets: true

# ---------------------------------------------------------------- news topics
# Every feed URL below answered with items on 2026-11-22.
# Each topic is read from Google News RSS searches (last 24 h, India edition) and/or publisher
# RSS feeds. hacker_news: true also pulls Hacker News top stories that match the keywords.
# weight: 1 = normal, 2 = favour it when ranking, 0.5 = only if it is big.
topics:
  - name: AI and tech
    weight: 1.5
    queries: ["artificial intelligence", "OpenAI OR Anthropic OR DeepMind OR Nvidia", "AI regulation"]
    feeds:
      - https://techcrunch.com/category/artificial-intelligence/feed/
      - https://www.theverge.com/rss/index.xml
      - https://feeds.arstechnica.com/arstechnica/index
    hacker_news: true
    keywords: [ai, llm, gpt, claude, gemini, openai, anthropic, nvidia, model, chip, robot]
    per_run: 10

  - name: Startups and funding
    weight: 1.5
    queries: ["Indian startup funding", "startup raises Series A OR Series B", "venture capital fund India"]
    feeds:
      - https://inc42.com/feed/
      - https://yourstory.com/feed
      - https://economictimes.indiatimes.com/tech/rssfeeds/13357270.cms
      - https://techcrunch.com/feed/
    per_run: 8

  - name: Markets and economy
    weight: 1
    queries: ["Sensex Nifty today", "Wall Street stocks close", "RBI OR Federal Reserve rates"]
    per_run: 6

  - name: Politics and policy
    weight: 1
    queries: ["India politics", "Parliament India bill policy", "world news geopolitics"]
    feeds:
      - https://www.thehindu.com/news/national/feeder/default.rss
    per_run: 6

  - name: Mumbai and Maharashtra
    weight: 1.5
    queries: ["Mumbai", "Maharashtra government", "BMC Mumbai"]
    feeds:
      - https://www.hindustantimes.com/feeds/rss/cities/mumbai-news/rssfeed.xml
    per_run: 8

# ---------------------------------------------------------------- markets (no model call)
# Yahoo Finance symbols. Add single stocks from Telegram: /brief watch NVDA (kept in prefs.json).
markets:
# group = the line it is printed on.
  - {symbol: "^GSPC", label: "S&P 500", group: US}
  - {symbol: "^IXIC", label: "Nasdaq", group: US}
  - {symbol: "^DJI", label: "Dow", group: US}
  - {symbol: "^VIX", label: "VIX", group: US}
  - {symbol: "^NSEI", label: "Nifty 50", group: India}
  - {symbol: "^BSESN", label: "Sensex", group: India}
  - {symbol: "^INDIAVIX", label: "India VIX", group: India}
  - {symbol: "^TNX", label: "US 10Y", unit: "%", group: Rates and FX}
  - {symbol: "INR=X", label: "USD/INR", group: Rates and FX}
gold:
  symbol: "GC=F"              # COMEX gold futures, USD per troy ounce
  fx_symbol: "INR=X"
  show_usd_per_oz: true       # also shows the world price converted to ₹/10 g (before duty and GST)
  india_ibja: true            # "Gold India*": IBJA 24K (999) ₹/10 g from ibjarates.com, excl. GST

# ---------------------------------------------------------------- mail and Slack filters
slack:
  max_messages: 200
  skip_channels: []           # channel names without '#'
  # Your own grouping (Slack's sidebar sections have no API). Channel names without '#';
  # a channel in no group goes to other_group, every DM and group DM to dm_group.
  groups: {}                  # e.g. {Core: [core-team, product], Hospital: [icu-ops], Home: [family]}
  dm_group: Direct messages
  other_group: Channels
  weights: {}                 # e.g. {Core: 2, Direct messages: 2, Hospital: 1.5, Channels: 0.5}
mail:
  max_messages: 50
  keep_newsletters_from: []   # senders whose list mail you still want
  # Money and HR mail: listed under its account by the script (subject only),
  # never sent to Gemini. Whole words, any case, in the subject; senders match anywhere.
  private_senders: []         # e.g. [razorpay.com, hdfcbank, payroll@yourcompany.com]
  private_subject_words: [payslip, salary, payroll, invoice, receipt, payment, refund, transaction,
                          debited, credited, statement, subscription, reimbursement, appraisal,
                          "offer letter", "form 16", tds, gst, emi, loan, "credit card"]
  # Dropped entirely: one-time codes, sign-in links and sign-in/security notices are useless
  # by 8:15 am. Python regular expressions, any case, matched against the subject.
  noise_subject_patterns:
    - '\b(verification|confirmation|security|login|sign[- ]?in|one[- ]time|access)\s+code\b'
    - '\bOTP\b'
    - '^\W*\d{4,8}\b.*\bcode\b'   # "618363 is your KIRI verification code"
    - '\b(secure|magic|sign[- ]?in|login)\s+link\b'
    - '\b(verify|confirm)\s+your\s+(email|e-mail|account)\b'
    - '\bsecurity\s+alert\b'       # Google "Security alert"
    - '\b(reset|change)\s+your\s+(\w+\s+)?password\b'
    - '\bpassword\s+(reset|change|changed|updated)\b'
    - '\bnew\s+(sign[- ]?in|login|device)\b'
    - '\b(signed|logged)\s+in\s+(to|from|on)\b'
    - '\bnew\s+(public|ssh|gpg|deploy)\s+key\b'   # GitHub "A new public key was added"
muted_words: []
muted_senders: []

# ---------------------------------------------------------------- ranking model
# Tried in order; a 429 / 5xx / timeout moves to the next. Check the exact IDs on the host with
# `python -m orchestrator.brief models` (lists what your key can call).
ranking:
  max_input_tokens: 12000     # keeps Gemma 4 (16K tokens/minute) usable as the last fallback
  models:
    - {id: gemini-3.1-flash-lite, json_mode: true}
    - {id: gemini-3.5-flash-lite, json_mode: true}
    - {id: gemma-4-31b-it, json_mode: false}

# ---------------------------------------------------------------- outreach (/slack, /meet)
# Slack messages sent as you and Outlook meetings. See orchestrator/outreach/README.md.
outreach:
  daily_cap: 50               # Slack messages + invites + channel posts sent for you per day
  preview_minutes: 30         # a plan waiting for /slack yes or /meet yes expires after this
  gap_minutes: 5              # break between back-to-back meetings (and around your busy events)
  default_length: 30          # 1:1 minutes when you don't say
  allhands_length: 60
  teams: true                 # every invite is a Teams meeting
  detect_days: 3              # "/meet 15:00-17:00": how far back to look for meeting requests
  big_from_people: 4          # this many people or more → models_big; fewer → models_small
  models_small:               # one person or a few: Flash-Lite first (Gemma is often overloaded)
    - {id: gemini-3.1-flash-lite, json_mode: true}
    - {id: gemma-4-31b-it, json_mode: false}
  models_big:                 # big batches (10 people, detection): Gemini first
    - {id: gemini-3.1-flash-lite, json_mode: true}
    - {id: gemini-3.5-flash-lite, json_mode: true}
    - {id: gemma-4-31b-it, json_mode: false}
  # How drafts sound: $HERMES_HOME/brief/outreach/style.md (free text, see outreach/README.md).
  # Your wording. Placeholders: {first} {name} {topic} {length} {day} {start} {end} {join}.
  # {join} becomes " Join on Teams: <link>" in the Slack note and the channel post.
  # Bodies are HTML (use <br> for a new line). Leave a key out to keep the default.
  templates:
    meeting_subject: "{topic} | 1:1"
    meeting_note: >-
      Hi {first}, I've sent you a calendar invite for {day}, {start}–{end} IST ({length} min)
      to discuss {topic}.{join} If the time doesn't work, let me know and I'll move it.
    allhands_subject: "All hands: {topic}"
    allhands_post: >-
      Hi everyone, we have an all-hands on {day}, {start}–{end} IST: {topic}. A calendar invite
      has been sent to everyone in this channel.{join}

# ---------------------------------------------------------------- HR (/hr payslip, /hr interview)
# Payslips from your monthly salary sheet. See orchestrator/hr/README.md. Pay never goes to a model.
hr:
  weekly_off: [sunday]        # LOP = Compensation ÷ working days × LOP days; add saturday if it's off
  holidays: []                # e.g. [2026-11-08, 2026-12-25]: not working days either
  payslip_template: payslip.docx   # in $HERMES_HOME/hr/templates/, with {{fields}}
  max_per_run: 200
  preview_minutes: 120        # a batch waiting for /hr payslip yes expires after this
  sender_name: "hr@medochealth.in, Medoc Health"   # signs the payslip email
  mailbox: hr@medochealth.in  # payslips go out From this address (Send As); leave out for your own
  # Saturdays are working days; only Sunday is off.
  mail_subject: "Payslip for {month}"
  mail_body: "Hi {first},<br><br>Please find attached your payslip for {month}.<br><br>Regards,<br>{sender}"
  # /hr interview: one Teams link for the block, each candidate invited to their own slot.
  max_interviews: 30          # candidates in one batch
  interview_minutes: 30       # a slot when the End is left out
  interview:                  # leave a key out to keep the default wording (orchestrator/hr/settings.py)
    company: "Medoc Health"
    # Placeholders: {first} {name} {position} {day} {start} {end} {length} {join} {sender} {company}
    candidate_subject: "Interview for {position} at {company} | {day}, {start} IST"
    # candidate_body: HTML; must contain {join}. The panel's also take {positions} {schedule}.
    panel_subject: "Interviews: {positions} | {day}"
  # /hr reply: Gemini drafts with names, emails and numbers hidden; templates use no model.
  redact_names: []            # more names to hide from Gemini, e.g. [Rishabh Jain, Nidhi Rao]
  reply_bulk_max: 30          # applications answered by one /hr reply applications ack
  # replies:                  # change or add a template (the middle of the mail; greeting and sign-off are added)
  #   ack: "Thank you for applying{for_role} at {company}. ..."
  # reply_models:             # default: gemini-3.1-flash-lite, gemini-3.5-flash-lite, gemma-4-31b-it (json_mode: false)

# ---------------------------------------------------------------- Smriti (/notes): meeting notes
# Teams meetings you organise (recorded + transcribed). See orchestrator/notes/README.md.
notes:
  check_hours: [10, 12, 14, 16, 18, 20]   # find ended meetings and ask what to make
  chunk_minutes: 45           # audio per Gemini call (an hour ≈ 115k tokens: 32 a second)
  gap_seconds: 70             # at least this long between two audio calls
  tokens_per_minute: 250000   # your Gemini limit; a call waits until it fits the last 60 seconds
  daily_audio_minutes: 180    # beyond this, transcription waits for the next day
  models: [gemini-3.1-flash-lite, gemini-3.5-flash-lite]   # must take audio (Gemma does not)
  handoff_repo: ""            # owner/name of your private repo for "claude" (GITHUB_HANDOFF_TOKEN in .env)
  max_attempts: 3             # a document failing this often is reported instead of retried

# ---------------------------------------------------------------- Watches (/watch)
# A script reads each page and tells you only when something is added. See orchestrator/watch/README.md.
watch:
  every_hours: 12             # how often a new watch is read (/watch every <n> <hours> per watch)
  claude: true                # Claude researches a new plain page for a steadier source (handoff repo)
  notes: true                 # Gemini adds a note to each change: which new items matter to you and why
  # handoff_repo: you/hermes-handoff   # default: notes.handoff_repo
  about: ""                   # a line on you and what matters, for Gemini's notes (keep private details out)
  fail_after: 3               # failed reads in a row before you're told (once)
  max_lines: 15               # new items listed in one message

# ---------------------------------------------------------------- Studio (/studio): video, audio, b-roll, images
# See orchestrator/studio/README.md. The voices are installed by orchestrator/studio/install.sh.
studio:
  engine: kokoro              # kokoro (server CPU, free, no limits) or edge (Microsoft's online voices, unofficial)
  voice_en: am_puck           # Kokoro (your picks: am_puck, then am_fenrir): /studio voices lists them (af_/am_ US, bf_/bm_ UK, hf_/hm_ Hindi)
  voice_hi: hm_omega          # for Hindi in Devanagari (Hinglish in Latin script is converted first)
  edge_voice_en: en-IN-PrabhatNeural   # Edge: /studio voices edge
  edge_voice_hi: hi-IN-MadhurNeural
  speed: 1.0                  # 0.5 to 2.0; 1.0 ≈ 196 words a minute (1.15 with pause 0.12 ≈ 217)
  pause: 0.15                 # seconds after each sentence
  profile: default            # page profile for videos: orchestrator/studio/profiles or $HERMES_HOME/studio/profiles
  threads: 2                  # CPU threads Kokoro may use (the host has 2)
  kokoro_model: kokoro-v1.0.fp16.onnx  # or kokoro-v1.0.int8.onnx (KOKORO_INT8=1 install.sh) if RAM is tight
  # Videos are 1080×1920 at 30 fps. Quality of the render:
  video_crf: 17               # lower = sharper and bigger (17 ≈ visually lossless; 23 is ffmpeg's default)
  video_preset: slow          # x264 speed: ultrafast … medium … slow … veryslow (slower = smaller file)
  video_jpeg_quality: 95      # frames as Chrome draws them, before encoding
  video_audio_bitrate: 320k   # AAC
  video_concurrency: 1        # frames drawn at once; each needs ~0.5–1 GB (the host has 4 GB)
  video_browser: ""           # a Chrome headless shell to use; "" = the one install.sh downloaded
  # Notes → storyboard (python -m orchestrator.studio write). Tried in order; a stronger model writes better scripts.
  script_models:
    - {id: gemini-3.5-flash-lite}
    - {id: gemini-3.1-flash-lite}
  claude_model: claude-opus-5-5   # `write --claude` / `/studio write claude`: needs ANTHROPIC_API_KEY; paid (~$0.10–0.25 a storyboard)
  claude_effort: medium           # low | medium | high | xhigh | max: how hard Claude thinks (more = slower, dearer)
